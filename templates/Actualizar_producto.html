<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Actualizar Producto</h1>
        <form action="/Actualizar_producto/{{ prod.id_producto }}" method="POST">
            <label>Nombre:</label><br>
            <input type="text" name="nombre" value="{{ prod.nombre }}" required><br><br>

            <label>Categoría:</label><br>
            <input type="text" name="categoria" value="{{ prod.categoria }}" required><br><br>

            <label>Precio:</label><br>
            <input type="number" step="0.01" name="precio" value="{{ prod.precio }}" required><br><br>

            <label>Stock:</label><br>
            <input type="number" name="stock" value="{{ prod.stock }}" required><br><br>

            <button type="submit" class="btn">Actualizar Producto</button>
            <a href="/productos" class="btn-secundario">Cancelar</a>
        </form>
    </div>
</body>
</html>
