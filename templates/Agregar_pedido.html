<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Pedido</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Agregar Nuevo Pedido</h1>
        
        <form action="/Agregar_pedido" method="POST">
            <label for="id_cliente">Cliente:</label><br>
            <select name="id_cliente" id="id_cliente" required>
                <option value="">-- Selecciona un Cliente --</option>
                {% for cli in clientes %}
                    <option value="{{ cli.id_cliente }}">{{ cli.nombre }}</option>
                {% endfor %}
            </select><br><br>

            <label for="fecha">Fecha del Pedido:</label><br>
            <input type="date" name="fecha" id="fecha" required><br><br>

            <label for="estado">Estado:</label><br>
            <select name="estado" id="estado" required>
                <option value="Pendiente">Pendiente</option>
                <option value="Completado">Completado</option>
                <option value="Cancelado">Cancelado</option>
            </select><br><br>

            <button type="submit" class="btn">Guardar Pedido</button>
            <a href="/pedidos" class="btn-secundario">Cancelar</a>
        </form>
    </div>
</body>
</html>
