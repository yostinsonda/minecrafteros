<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Pedido</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Agregar Nuevo Pedido</h1>
        <form action="/Agregar_pedido" method="POST">
            <label>Cliente:</label><br>
            <input type="text" name="cliente" required><br><br>

            <label>Fecha:</label><br>
            <input type="date" name="fecha" required><br><br>

            <label>Estado:</label><br>
            <select name="estado" required>
                <option value="Pendiente">Pendiente</option>
                <option value="Completado">Completado</option>
                <option value="Cancelado">Cancelado</option>
            </select><br><br>

            <label>Total:</label><br>
            <input type="number" step="0.01" name="total" required><br><br>

            <button type="submit" class="btn">Guardar Pedido</button>
            <a href="/pedidos" class="btn-secundario">Cancelar</a>
        </form>
    </div>
</body>
</html>
