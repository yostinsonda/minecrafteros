<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - Cafetería</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .acciones-abajo {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .form-accion {
            display: inline-block;
            margin-right: 20px;
            margin-bottom: 10px;
        }
        .form-accion input[type="number"] {
            width: 80px;
            padding: 5px;
        }
        .btn-actualizar { background-color: #2196F3; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-borrar { background-color: #f44336; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Listado de Productos</h1>
        
        <!-- Botón Agregar arriba -->
        <a href="/Agregar_producto" class="btn">Agregar Producto</a>
        <br><br>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody>
                {% for prod in productos %}
                <tr>
                    <td>{{ prod.id_producto }}</td>
                    <td>{{ prod.nombre }}</td>
                    <td>{{ prod.categoria }}</td>
                    <td>${{ "%.2f"|format(prod.precio|float) }}</td>
                    <td>{{ prod.stock }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- Sección de acciones FUERA y ABAJO de la tabla -->
        <div class="acciones-abajo">
            <h3>Acciones sobre productos:</h3>
            
            <!-- Formulario Actualizar -->
            <form action="/buscar_actualizar_producto" method="POST" class="form-accion">
                <label for="id_prod_act">ID a Actualizar:</label>
                <input type="number" id="id_prod_act" name="id_producto" required min="1">
                <button type="submit" class="btn-actualizar">Actualizar Producto</button>
            </form>

            <!-- Formulario Borrar -->
            <form action="/Borrar_producto" method="POST" class="form-accion" onsubmit="return confirm('¿Seguro que deseas borrar este producto?');">
                <label for="id_prod_bor">ID a Borrar:</label>
                <input type="number" id="id_prod_bor" name="id_producto" required min="1">
                <button type="submit" class="btn-borrar">Borrar Producto</button>
            </form>
        </div>

        <br>
        <a href="/pedidos" class="btn-secundario">Ir a Pedidos</a>
        <a href="/" class="btn-secundario">Volver al Inicio</a>
    </div>
</body>
</html>
