<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - Cafetería</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Listado de Productos</h1>
        
        <!-- El botón Agregar va FUERA de la tabla y NO lleva prod.id_producto -->
        <a href="/Agregar_producto" class="btn">Agregar Producto</a>
        <br><br>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dentro del FOR sí podemos usar 'prod' -->
                {% for prod in productos %}
                <tr>
                    <td>{{ prod.id_producto }}</td>
                    <td>{{ prod.nombre }}</td>
                    <td>{{ prod.categoria }}</td>
                    <td>${{ "%.2f"|format(prod.precio|float) }}</td>
                    <td>{{ prod.stock }}</td>
                    <td>
                        <!-- Los botones con ID van DENTRO del ciclo -->
                        <a href="/Actualizar_producto/{{ prod.id_producto }}">Actualizar</a> | 
                        <a href="/Borrar_producto/{{ prod.id_producto }}" onclick="return confirm('¿Seguro que deseas borrar este producto?');">Borrar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <br>
        <a href="/" class="btn-secundario">Volver al Inicio</a>
    </div>
</body>
</html>
